<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宏观与半导体情报终端 · Macro Intel Terminal v2</title>
<style>
:root{
  --bg0:#0b0d10;--bg1:#12151a;--bg2:#181c23;--bg3:#1f242d;--line:#262c36;--line2:#323946;
  --tx:#d7dade;--tx2:#9aa1ab;--tx3:#6b727d;
  --steel:#5b8db8;--steel2:#3d6a91;--red:#c81e2b;--red2:#8e1620;--amber:#d49a2a;--green:#4f9a74;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg0);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.6}
a{color:var(--steel)}
button{font-family:inherit;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--tx);border:1px solid var(--line2);border-radius:4px;padding:5px 10px}
button:hover{border-color:var(--tx3);background:var(--bg3)}
button.primary{background:var(--red2);border-color:var(--red)}
button.ghost{background:transparent}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--bg0);color:var(--tx);border:1px solid var(--line2);border-radius:4px;padding:5px 8px}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:12.5px}
h2{font-size:15px;margin:0 0 10px;font-weight:600;letter-spacing:.3px}
h3{font-size:13px;margin:0 0 8px;color:var(--tx2);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.mono{font-family:var(--mono)}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.red{color:var(--red)}.steel{color:var(--steel)}.amber{color:var(--amber)}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--bg1);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding:9px 18px;flex-wrap:wrap}
.topbar .tools{flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.6px;font-size:14px;white-space:nowrap}
.brand small{font-weight:400;color:var(--tx3);margin-left:8px;font-family:var(--mono);font-size:11.5px}
.topbar .spacer{flex:1}
.topbar .tools{display:flex;gap:6px;align-items:center}
.boss-dot{width:11px;height:11px;border-radius:50%;background:#2a3039;border:1px solid #3a414c;padding:0;margin-left:6px}
.boss-dot:hover{background:#4a525e}
.kpis{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line);overflow-x:auto}
.kpi{flex:1;min-width:150px;background:var(--bg1);padding:7px 14px;cursor:pointer}
.kpi:hover{background:var(--bg2)}
.kpi .k{font-size:11px;color:var(--tx3);letter-spacing:.4px;white-space:nowrap}
.kpi .v{font-family:var(--mono);font-size:17px;font-weight:600}
.kpi .s{font-size:11px;color:var(--tx2);white-space:nowrap}
nav.tabs{display:flex;gap:0;padding:0 12px;border-top:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;color:var(--tx2);white-space:nowrap}
nav.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
nav.tabs button[data-tab=m2].on,nav.tabs button[data-tab=m3].on{border-bottom-color:var(--steel)}
nav.tabs button[data-tab=m1].on,nav.tabs button[data-tab=m4].on{border-bottom-color:var(--red)}

main{padding:18px;max-width:1500px;margin:0 auto}
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{margin:0}
.panel-head .sub{color:var(--tx3);font-size:12px}
.panel-head .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--tx2);margin-right:4px;white-space:nowrap}
.chip.red{border-color:var(--red);color:#ff6b75;background:rgba(200,30,43,.1)}
.chip.amber{border-color:var(--amber);color:var(--amber);background:rgba(212,154,42,.08)}
.chip.steel{border-color:var(--steel);color:var(--steel)}
.chip.btn{cursor:pointer}
.chip.btn.on{background:var(--tx);color:var(--bg0);border-color:var(--tx)}
.note{font-size:12px;color:var(--tx2);border-left:2px solid var(--line2);padding:4px 10px;margin:8px 0}
.note.red{border-left-color:var(--red)}

/* timeline */
.tl{position:relative;display:flex;gap:0;overflow-x:auto;padding:26px 4px 8px}
.tl:before{content:"";position:absolute;left:0;right:0;top:40px;height:1px;background:var(--line2)}
.tl-node{flex:0 0 132px;position:relative;cursor:pointer;padding:0 6px;text-align:center}
.tl-node .dot{width:12px;height:12px;border-radius:50%;background:var(--bg0);border:2px solid var(--tx2);margin:8px auto 8px;position:relative;z-index:1}
.tl-node.hot .dot{border-color:var(--red);background:var(--red)}
.tl-node.future .dot{border-style:dashed;border-color:var(--tx3)}
.tl-node .d{font-family:var(--mono);font-size:11px;color:var(--tx3);position:absolute;top:-22px;left:0;right:0}
.tl-node .t{font-size:12.5px;line-height:1.35}
.tl-node .m{font-size:11px;color:var(--tx3);margin-top:3px}
.tl-node:hover .t{color:#fff}

/* matrix */
.mx-group{margin-bottom:14px}
.mx-group .lbl{font-size:12px;color:var(--tx3);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.mx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pc{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:4px;padding:7px 9px;cursor:pointer;transition:background .15s}
.pc:hover{background:var(--bg3)}
.pc .n{font-weight:600;font-size:13.5px}
.pc .r{font-size:11.5px;color:var(--tx2);line-height:1.35;margin-top:2px}
.pc .st{font-size:10.5px;margin-top:4px;font-family:var(--mono)}
.pc.fallen{border-left-color:var(--red);background:rgba(200,30,43,.07)}
.pc.fallen .n{color:#ff8a92;text-decoration:line-through;text-decoration-color:rgba(200,30,43,.6)}
.pc.promoted{border-left-color:var(--amber);background:rgba(212,154,42,.06)}
.pc.pulse,.rrow.pulse{animation:pulse 1s ease-in-out infinite;outline:1px solid var(--amber)}
.pc.src{outline:2px solid var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,154,42,.0)}50%{box-shadow:0 0 0 4px rgba(212,154,42,.45)}}
.banner{background:rgba(212,154,42,.08);border:1px solid var(--amber);border-radius:4px;padding:8px 12px;margin-bottom:10px;font-size:12.5px}

/* tiger feed */
.feed{max-height:520px;overflow:auto;border-top:1px solid var(--line)}
.fi{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.fi:hover{background:var(--bg2)}
.fi .dt{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
.fi .nm{font-weight:600}
.fi .ds{font-size:12px;color:var(--tx2)}

/* radar */
.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
@media(max-width:900px){.sliders{grid-template-columns:1fr}}
.sl label{display:flex;justify-content:space-between;font-size:12px}
.sl label b{font-family:var(--mono);color:var(--amber)}
.sl .h{font-size:11px;color:var(--tx3);line-height:1.35}
input[type=range]{width:100%;accent-color:var(--red);padding:0;border:0;background:transparent}
.rlist{margin-top:14px}
.rrow{display:grid;grid-template-columns:28px 92px 1fr 150px 54px;gap:10px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover{background:var(--bg2)}
.rrow .rk{font-family:var(--mono);color:var(--tx3);font-size:12px}
.rrow .nm{font-weight:600;font-size:13px}
.rrow .nm small{display:block;font-weight:400;color:var(--tx3);font-size:10.5px}
.bar{height:8px;background:var(--bg0);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6b2a2f,var(--red));transition:width .25s}
.bar.psc i{background:linear-gradient(90deg,#4a4f58,#8a8f99)}
.fx{display:flex;gap:2px}
.fx span{flex:1;height:14px;border-radius:2px;background:var(--bg0);font-size:9px;font-family:var(--mono);text-align:center;line-height:14px;color:#0b0d10}
.rrow .sc{font-family:var(--mono);text-align:right;font-weight:600}

/* diff */
.diff{font-family:var(--mono);font-size:12.5px;background:var(--bg0);border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:420px}
.dl{display:grid;grid-template-columns:22px 1fr;padding:2px 10px;border-bottom:1px solid #14171c;white-space:pre-wrap;word-break:break-all}
.dl .g{color:var(--tx3);user-select:none}
.dl.del{background:rgba(120,120,120,.08);color:var(--tx3)}
.dl.del .tx{text-decoration:line-through;text-decoration-color:#666}
.dl.add{background:rgba(200,30,43,.10)}
.dl.add .g{color:var(--red)}
.dl.mod{background:rgba(255,255,255,.02)}
.dl del{color:var(--tx3);background:rgba(120,120,120,.18);text-decoration:line-through}
.dl ins{color:#ffd2d5;background:rgba(200,30,43,.45);text-decoration:none;border-radius:2px;padding:0 1px}
.dl.same{color:var(--tx2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(640px,96vw);background:var(--bg1);border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .25s ease;z-index:90;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .dh .kick{font-size:11px;color:var(--tx3);letter-spacing:.6px;font-family:var(--mono)}
.drawer .dh .tt{font-size:17px;font-weight:700;line-height:1.3}
.drawer .dh .x{margin-left:auto}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.drawer.accent-red .dh{border-top:3px solid var(--red)}
.drawer.accent-steel .dh{border-top:3px solid var(--steel)}
.drawer.accent-amber .dh{border-top:3px solid var(--amber)}
.box{border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin-bottom:10px;background:var(--bg2)}
.box h4{margin:0 0 6px;font-size:12.5px;letter-spacing:.4px}
.box.skip{opacity:.75}.box.skip h4{color:var(--tx3)}
.box.meat h4{color:var(--red)}
.box.bottom{border-color:var(--tx3)}.box.bottom h4{color:var(--tx)}
.box p{margin:0 0 6px}.box ul{margin:0;padding-left:18px}
.r4{}@media(max-width:1100px){.r4{grid-template-columns:1fr 1fr !important}}@media(max-width:640px){.r4{grid-template-columns:1fr !important}}
.dd{cursor:pointer;border-radius:3px;transition:background .12s}.dd:hover{background:var(--bg3)}
.q4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.q4{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--tx3);font-weight:500;font-size:11.5px}
table.t tr.hl td{background:rgba(200,30,43,.08)}
table.t tr.cut td{border-bottom:2px solid var(--red)}
.facedit{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.facedit label{font-size:10.5px;color:var(--tx3);display:block;text-align:center}
.facedit input{width:100%;text-align:center;font-family:var(--mono)}

/* tooltip */
.term{border-bottom:1px dotted var(--tx3);cursor:help}
#tip{position:fixed;z-index:200;max-width:300px;background:#0e1014;border:1px solid var(--line2);border-radius:5px;padding:7px 10px;font-size:12px;line-height:1.5;color:var(--tx);pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip.on{opacity:1}
#tip b{color:var(--amber)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);padding:8px 16px;border-radius:5px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

.ph{border:1px dashed var(--line2);border-radius:6px;padding:28px;text-align:center;color:var(--tx3)}
.ph ul{text-align:left;display:inline-block;margin:10px auto 0;color:var(--tx2)}
footer{color:var(--tx3);font-size:11.5px;text-align:center;padding:20px}
svg text{font-family:var(--mono)}

/* ===== BOSS MODE ===== */
body.boss{--bg0:#ffffff;--bg1:#ffffff;--bg2:#fafafa;--bg3:#f0f0f0;--line:#e3e3e3;--line2:#cfcfcf;--tx:#111;--tx2:#444;--tx3:#777;--steel:#111;--steel2:#333;--red:#111;--red2:#222;--amber:#333;--green:#999}
body.boss,body.boss *{font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif !important}
body.boss .mono,body.boss .kpi .v,body.boss .diff{font-family:"Courier New",monospace !important}
body.boss .pc.fallen{background:#f4f4f4}.body.boss .pc.fallen .n{color:#111}
body.boss .pc.fallen .n{color:#111}
body.boss .bar i{background:#555 !important}
body.boss .chip.red,body.boss .chip.amber{background:transparent;color:#111;border-color:#111}
body.boss .dl ins{background:#ddd;color:#000}
body.boss .dl.add{background:#f5f5f5}
body.boss button.primary{background:#111;color:#fff}
body.boss .tl-node.hot .dot{background:#111;border-color:#111}
body.boss #tip{background:#fff;color:#111}
body.boss .drawer{box-shadow:-4px 0 20px rgba(0,0,0,.15)}
body.boss .fx span{filter:grayscale(1)}
body.boss main svg{filter:grayscale(1)}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand" id="brandTitle">宏观政治 × 全球半导体 情报终端<small id="syncLbl">BASELINE 2026-11-24 · v2 · FULL · 4.19</small></div>
    <div class="spacer"></div>
    <div class="tools">
      <button id="btnNote" title="Shift+N">+ 快速记录</button><button id="btnWeekly">◷ 3分钟周报</button><button class="primary" id="btnPrompt">⧉ 复制今日更新指令</button><button id="btnImport">⇪ 导入增量 JSON</button><button class="ghost" id="btnGloss">[? 体制与级别图鉴]</button>
      <button class="ghost" id="btnExport" title="导出全量 JSON 备份">⇩ 导出备份</button>
      <button class="ghost" id="btnRestore" title="从导出的 JSON 备份恢复">⇧ 恢复备份</button><input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
      <button class="ghost" id="btnReset" title="重置基线（保留个人笔记）">↺ 重置基线</button>
      <button class="boss-dot" id="btnBoss" title="Shift+B"></button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="m1">① 政治周期 & 人事反腐</button>
    <button data-tab="m2">② 芯片博弈：谁卡谁</button>
    <button data-tab="m3">③ 中美 AI 国运计分板</button>
    <button data-tab="m4">④ 台海与军事态势</button>
    <button data-tab="m5">⑤ 元首外交雷达</button>
    <button data-tab="m6">⑥ 跨轨时间轴 & 周报</button>
    <button data-tab="m7">⑦ 中国体温计</button>
    <button data-tab="m8">⑧ 央行工具箱</button>
  </nav>
</header>

<main id="main"></main>
<footer id="foot"></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><div><div class="kick" id="dKick"></div><div class="tt" id="dTitle"></div></div><button class="x ghost" id="dClose">✕ Esc</button></div>
  <div class="db" id="dBody"></div>
</aside>
<div id="tip"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
/* =========================================================
   0. 存储层（schema v2，向上兼容）
   ========================================================= */
var KEY='macro_intel_terminal_v2', SCHEMA=2, BASELINE='2026-11-24';
var DEFAULT_W={F1:25,F2:25,F3:15,F4:15,F5:10,F6:10};
function defaults(){return{schema:SCHEMA,createdAt:new Date().toISOString(),baseline:BASELINE,lastSync:BASELINE,
  weights:Object.assign({},DEFAULT_W),factorOverrides:{},personNotes:{},notes:[],imports:[],snapshots:[],
  overlay:{},radarHist:{},ui:{tab:'m1',boss:false,tigerFilter:'all',diffPreset:0,lines:{cn:1,semi:1,ai:1,tw:1,dip:1},q:'',noiseHideL2:0}};}
function load(){
  var raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){raw=null;}
  var st=defaults();
  if(!raw){ // 尝试迁移旧版键
    try{var old=JSON.parse(localStorage.getItem('macro_intel_terminal')||'null');if(old){raw=old;}}catch(e){}
  }
  if(raw&&typeof raw==='object'){
    Object.keys(raw).forEach(function(k){
      if(k==='weights'||k==='ui'||k==='factorOverrides'||k==='personNotes'||k==='overlay'){st[k]=Object.assign({},st[k],raw[k]||{});}
      else if(Array.isArray(st[k])){st[k]=Array.isArray(raw[k])?raw[k]:st[k];}
      else st[k]=raw[k];
    });
    st.schema=SCHEMA; // 升级标记，保留所有未知字段
  }
  return st;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('⚠ localStorage 写入失败（可能为隐私模式或配额已满）');}}
save();

/* =========================================================
   1. 基础数据：术语表 / 级别天梯 / 党政职能
   ========================================================= */
var GLOSS={
 '中办':'中共中央办公厅。总书记的“大内总管+机要秘书处”，管文件、日程、警卫。主任：蔡奇（兼）。',
 '中组部':'中共中央组织部。全国超级 HR 总署：管所有中管干部的提拔、调动、考核。',
 '中宣部':'中共中央宣传部。全国总编辑部+品牌公关中心，管媒体口径、出版、意识形态。',
 '中纪委':'中央纪律检查委员会（与国家监委合署）。党内“最高内审+反腐特警”，“打虎”的执行机关。',
 '国家监委':'国家监察委员会，与中纪委一套人马两块牌子，可对公职人员“留置”。',
 '政法委':'中央政法委员会。统管法院、检察院、公安、国安、司法行政的“政法总调度”。',
 '统战部':'中央统战部。负责党外人士、民族宗教、港澳台海外华人工作的“统一战线 BD 部”。',
 '中财办':'中央财经委员会办公室。经济决策的“总参谋部”，起草经济大政方针。',
 '中央金融委':'中央金融委员会（2023年组建）。把金融监管的最终拍板权收归党中央。',
 '中央科技委':'中央科技委员会（2023年组建）。统筹“卡脖子”攻关与科技资源的党中央机构。',
 '中央外办':'中央外事工作委员会办公室。对外政策总协调，主任：王毅。',
 '社工部':'中央社会工作部（2023年组建）。管基层治理、信访、新兴群体（快递骑手、网红等）的党建。',
 '发改委':'国家发展和改革委员会。“小国务院”，管规划、项目审批、价格、宏观调控工具。',
 '工信部':'工业和信息化部。管制造业、通信、芯片产业政策落地。',

function normW(){var w=S.weights,sum=0;Object.keys(w).forEach(function(k){sum+=+w[k];});if(sum<=0)sum=1;var r={};Object.keys(w).forEach(function(k){r[k]=(+w[k])/sum;});return r;}

var TERMS=Object.keys(GLOSS).sort(function(a,b){return b.length-a.length;});
var TERM_RE=new RegExp('('+TERMS.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','g');
var BOSS_MAP={'秦城':'Q-Index','打虎':'合规审查','台海':'区域T','落马':'离任','被查':'受审视','反腐':'治理','清洗':'调整','解放军':'防务部门','军委':'防务委员会','中纪委':'审计委员会','开除党籍':'除名','双开':'除名','军籍':'编制','谁今晚睡不着':'关联网络','政治局':'委员会','常委':'核心委员'};
var BOSS_RE=new RegExp(Object.keys(BOSS_MAP).sort(function(a,b){return b.length-a.length;}).join('|'),'g');
function walkText(root,fn){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode;if(!p)return NodeFilter.FILTER_REJECT;
    if(p.namespaceURI!=='http://www.w3.org/1999/xhtml')return NodeFilter.FILTER_REJECT;
    var tag=p.nodeName;if(/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT)$/.test(tag))return NodeFilter.FILTER_REJECT;
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
  var list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(fn);
}
function applyTips(root){
  walkText(root,function(n){
    var p=n.parentNode;if(p.closest&&p.closest('.term,.no-tip,button,.chip,nav,.kpi,.dh'))return;
    var v=n.nodeValue;TERM_RE.lastIndex=0;if(!TERM_RE.test(v))return;TERM_RE.lastIndex=0;
    var frag=document.createDocumentFragment(),last=0,m;
    while((m=TERM_RE.exec(v))){if(m.index>last)frag.appendChild(document.createTextNode(v.slice(last,m.index)));
      var s=document.createElement('span');s.className='term';s.setAttribute('data-term',m[1]);s.textContent=m[1];frag.appendChild(s);last=m.index+m[1].length;}
    if(last<v.length)frag.appendChild(document.createTextNode(v.slice(last)));
    p.replaceChild(frag,n);
  });
}
function applyBoss(root){walkText(root,function(n){var v=n.nodeValue;BOSS_RE.lastIndex=0;if(BOSS_RE.test(v)){n.nodeValue=v.replace(BOSS_RE,function(k){return BOSS_MAP[k];});}});}
function post(root){applyTips(root);if(S.ui.boss)applyBoss(root);}

/* ---- Diff 引擎：分句 LCS + 句内逐字 LCS ---- */
function clauses(s){return (s.replace(/\r/g,'').match(/[^，。；、：！？\n]+[，。；、：！？]?|\n/g)||[]).map(function(x){return x.trim();}).filter(Boolean);}
function lcsOps(a,b,eq){
  var n=a.length,m=b.length,i,j,dp=[];for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=eq(a[i],b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var ops=[];i=0;j=0;while(i<n&&j<m){if(eq(a[i],b[j])){ops.push({t:'same',a:a[i]});i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:'del',a:a[i]});i++;}else{ops.push({t:'add',b:b[j]});j++;}}
  while(i<n)ops.push({t:'del',a:a[i++]});while(j<m)ops.push({t:'add',b:b[j++]});return ops;
}
function strip(s){return s.replace(/[，。；、：！？]$/,'');}
function charDiff(x,y){
  if(x.length*y.length>90000)return{a:'<del>'+esc(x)+'</del>',b:'<ins>'+esc(y)+'</ins>',sim:0};
  var ops=lcsOps(x.split(''),y.split(''),function(p,q){return p===q;});var A='',B='',same=0,buf={t:null,s:''};
  var out=[];ops.forEach(function(o){var t=o.t,c=o.a!=null?o.a:o.b;if(t==='same')same++;if(buf.t===t)buf.s+=c;else{if(buf.t)out.push(buf);buf={t:t,s:c};}});if(buf.t)out.push(buf);
  out.forEach(function(o){if(o.t==='same'){A+=esc(o.s);B+=esc(o.s);}else if(o.t==='del')A+='<del>'+esc(o.s)+'</del>';else B+='<ins>'+esc(o.s)+'</ins>';});
  return{a:A,b:B,sim:same/Math.max(x.length,y.length)};
}
function diffHTML(A,B){
  var ops=lcsOps(clauses(A),clauses(B),function(p,q){return strip(p)===strip(q);});
  var rows=[],k=0;
  while(k<ops.length){
    if(ops[k].t==='same'){rows.push('<div class="dl same"><span class="g"> </span><span class="tx">'+esc(ops[k].a)+'</span></div>');k++;continue;}
    var dels=[],adds=[];while(k<ops.length&&ops[k].t!=='same'){if(ops[k].t==='del')dels.push(ops[k].a);else adds.push(ops[k].b);k++;}
    var ai=0;
    dels.forEach(function(d){
      var best=-1,bs=0,bcd=null;
      for(var j=ai;j<adds.length;j++){var cd=charDiff(d,adds[j]);if(cd.sim>bs){bs=cd.sim;best=j;bcd=cd;}}
      if(best>=0&&bs>=0.3){
        for(;ai<best;ai++)rows.push('<div class="dl add"><span class="g">+</span><span class="tx">'+esc(adds[ai])+'</span></div>');
        rows.push('<div class="dl mod"><span class="g">-</span><span>'+bcd.a+'</span></div><div class="dl mod"><span class="g" style="color:var(--red)">+</span><span>'+bcd.b+'</span></div>');ai=best+1;
      }else rows.push('<div class="dl del"><span class="g">-</span><span class="tx">'+esc(d)+'</span></div>');
    });
    for(;ai<adds.length;ai++)rows.push('<div class="dl add"><span class="g">+</span><span class="tx">'+esc(adds[ai])+'</span></div>');
  }
  return '<div class="diff no-tip">'+rows.join('')+'</div>';
}
function renderDiff(){
  var i=+S.ui.diffPreset,box=$('#diffBox');
  if(i===-1){
    var c=S.overlay.customDiff||{A:'',B:''};
    box.innerHTML='<div class="grid2"><div><h3>旧版原文 (A)</h3><textarea id="dA" rows="6" placeholder="粘贴旧版公报/讲话段落">'+esc(c.A)+'</textarea></div><div><h3>新版原文 (B)</h3><textarea id="dB" rows="6" placeholder="粘贴新版公报/讲话段落">'+esc(c.B)+'</textarea></div></div><div style="margin:8px 0"><button class="primary" id="dRun">⇄ 逐字对比</button> <span class="dim" style="font-size:12px">按标点分句做 LCS 比对，句内再逐字比对；输入内容自动保存至本地。</span></div><div id="dOut"></div>';

    if(c.A||c.B)$('#dOut').innerHTML=diffHTML(c.A,c.B);
  }else{
    var DD=allDiffs();var d=DD[i]||DD[0];
    box.innerHTML='<div class="mono dim" style="font-size:11.5px;margin-bottom:6px">--- a/'+esc(d.a)+'<br>+++ b/'+esc(d.b)+'</div>'+diffHTML(d.A,d.B)+'<div class="box" style="margin-top:10px"><h4 class="red">政策转向解读</h4><p>'+d.read+'</p></div>';

function parseIncoming(txt){
  txt=String(txt||'').trim().replace(/^﻿/,'');
  var fence=txt.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);if(fence)txt=fence[1].trim();
  if(txt.indexOf('{')<0&&txt.indexOf('[')<0)throw new Error('没有找到 JSON 内容');

function mergeIntoDefaults(raw){
  var st=defaults();
  if(raw&&typeof raw==='object'){
    Object.keys(raw).forEach(function(k){
      if(k==='weights'||k==='ui'||k==='factorOverrides'||k==='personNotes'||k==='overlay'){st[k]=Object.assign({},st[k],raw[k]||{});}
      else if(Array.isArray(st[k])){st[k]=Array.isArray(raw[k])?raw[k]:st[k];}
      else st[k]=raw[k];
    });
    st.schema=SCHEMA;
  }
  return st;
}
function restoreFromText(txt){
  var obj;try{obj=JSON.parse(txt);}catch(e){toast('恢复失败：不是合法的 JSON');return false;}
  var raw=(obj&&obj.state&&typeof obj.state==='object')?obj.state:obj;
  if(!raw||typeof raw!=='object'||Array.isArray(raw)){toast('恢复失败：文件里没有状态对象');return false;}
  var known=['weights','overlay','notes','personNotes','ui','snapshots','imports'].filter(function(k){return k in raw;});
  if(!known.length){toast('恢复失败：看起来不是本终端的备份文件');return false;}
  var info='备份时间：'+(obj.exportedAt||'未知')+'\n笔记 '+((raw.notes||[]).length)+' 条 · 导入日志 '+((raw.imports||[]).length)+' 条 · 快照 '+((raw.snapshots||[]).length)+' 个';
  if(!confirm('用这份备份覆盖当前全部本地数据？\n\n'+info+'\n\n建议先“⇩ 导出备份”保存当前状态。'))return false;
  S=mergeIntoDefaults(raw);save();renderAll();toast('已从备份恢复');return true;
}

function ecoLine(mode){

  var max=mode==='rel'?100:32,x=function(i){return L+i*(W-L-R)/(n-1);},y=function(v){return T+(H-T-B)*(1-v/max);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:900px">';

  ['us','cn','jp'].forEach(function(k){var c=ECO_C[k][1],pts=ECO_Y.map(function(_,i){return x(i)+','+y(val(k,i));}).join(' ');

 ['中国约 37 万亿国际元，比美国高约 27%。','购买力平价（PPP）衡量的是“在本国能买到多少东西”：同样 1 美元，在中国能买到的理发、饭菜、地铁票比在美国多。所以 <b>PPP 更能反映国内生活和生产规模，名义 GDP 更能反映国际购买力</b>——买芯片、买石油、买军火，用的都是美元。','两种口径各有立场：强调“中国已经第一”的人用 PPP，强调“差距在拉大”的人用名义值。都对，问的问题不一样。','IMF 每年 4 月、10 月更新的《世界经济展望》。'],

 ['中国 5.0%，美国 2.8%，日本约 0.1%。','中国的 5% 是“目标”，几乎每年都精准达标，市场普遍怀疑存在平滑处理。一些外部机构（如荣鼎咨询）估算的实际增速更低。另外，<b>增速高不等于日子好过</b>：通缩环境下，企业利润和工资涨得比实际增速慢。','美国在高利率下仍有 2.8% 增长，靠的是消费和 AI 投资；日本几乎零增长，但工资在 30 年来第一次明显上涨。','中国的发电量、货运量、税收收入等“硬数据”与官方增速是否一致。'],

 ['日本约 237%，美国约 121%，中国约 88%（IMF 政府总债务口径）。','中国的 88% <b>严重低估了真实负担</b>，因为它基本不包含地方政府融资平台（城投）的债务。IMF 用“广义政府债务”口径，把城投等算进去，中国大约在 GDP 的 110–120% 以上。详情见专题“中国隐性债务”。<br><br>日本的 237% 看起来最吓人，但它的国债绝大部分由本国人和日本央行持有（日本央行持有约一半），而且以日元计价，很难发生外债危机。','真正要看的是“谁借的、借给谁、能不能付利息”，不是一个比例。美国的问题在于利息支出——已经超过国防开支。','美国国债利息支出占财政收入的比例；日本 10 年期国债收益率；中国城投债利差。'],
 ['中国约 3.6 万亿美元，美国约 2.1 万亿，日本约 0.7 万亿。','中国是全球最大的货物出口国，制造业增加值约占全球的 30%。贸易顺差约 1 万亿美元，<b>是有史以来最大的</b>。内需不足的产能只能往外卖，这正是美欧加关税的原因：他们把中国的出口看成“输出通缩”。','出口是中国经济现在最强的一条腿，也是最容易被关税打击的一条腿。对美出口下降的部分，正在转向东南亚、拉美、中东和“一带一路”国家（以及经东南亚转口）。','中国对东盟、墨西哥的出口增速；美国从越南、墨西哥进口中的“中国含量”。'],
 ['中国约 14.1 亿，美国约 3.4 亿，日本约 1.24 亿。','中国人口从 2022 年起连续下降，2024 年出生约 954 万人，不到 2016 年的一半；印度在 2023 年超过中国成为人口第一。日本已经连续十几年人口减少。美国靠移民仍在增长，这也是美国长期增长最大的结构性优势。','人口减少的直接后果：劳动力减少、养老金压力上升、房地产需求长期萎缩。中国的应对是延迟退休（2025 年起渐进实施）、育儿补贴，以及用自动化和 AI 替代劳动力。','中国每年 1 月公布的出生人口；育儿补贴政策的力度。']

function autoPullLatest(){
  if(!/^https?:/.test(location.protocol))return;
  fetch('data/latest.json',{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(t){
    if(!t)return;var j=parseIncoming(t);var stamp=j.generatedAt||j.date||t.length;
    if(S.ui.lastAutoPull===stamp)return;
    var r=mergeIncoming(j);rebuildP();S.ui.lastAutoPull=stamp;save();renderAll();toast('已自动导入今日增量'+(r&&r.added!=null?'：新增 '+r.added+' 条':''));
  }).catch(function(){});
}

  if(C.age){h+='<div style="font-size:12px;margin:8px 0 2px" class="dim">年龄投票率假设（可调；年龄差距用中国时报封关民调，选民数用中选会 2024 分层）</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11px">'+C.age.l.map(function(l,i){return '<div style="text-align:center"><div class="dim">'+l+'</div><div class="mono" style="color:'+(C.age.m[i]<0?'#4caf7a':'#5b8def')+'">'+(C.age.m[i]>0?'+':'')+C.age.m[i]+'</div><input class="mono" data-sim="'+c+'.t.'+i+'" value="'+s.t[i]+'" style="width:42px;background:#0e131b;border:1px solid #2a3442;color:#e6e9ef;padding:2px;border-radius:4px;text-align:center">%</div>';}).join('')+'</div><div class="dim" style="font-size:11px;margin-top:3px">默认投票率是假设值（台北没有公开的年龄别投票率）。把 20–29 岁从 60 改成 75，看看结果怎么变。年龄造成的移动：<b class="mono">'+(R.age>0?'+':'')+R.age.toFixed(2)+'</b> 点</div>';}
  h+='<div style="margin-top:8px">'+simCurve(c,R)+'</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px;font-size:12px">';
  h+='<div><div class="dim">民调平均（'+R.n+' 份）</div><b class="mono">'+(R.avg>0?'+':'')+R.avg.toFixed(1)+'</b></div>';
  h+='<div><div class="dim">模型中心（含小党）</div><b class="mono">'+(R.mu>0?'+':'')+R.mu.toFixed(1)+' ± '+R.sd.toFixed(1)+'</b></div>';
  h+='<div><div class="dim">'+C.a+' 胜率：模型 / 盘口</div><b class="mono" style="font-size:15px">'+simPct(R.pA)+'</b> <span class="mono dim">/ '+R.mkt.toFixed(0)+'%</span></div>';
  h+='<div><div class="dim">'+C.b+' 胜率</div><b class="mono" style="font-size:15px;color:#4caf7a">'+simPct(1-R.pA)+'</b></div>';
  if(c==='tpe'){h+='<div><div class="dim">沈 ≥ +4：模型 / Kalshi Yes 价</div><b class="mono" style="font-size:15px;color:#e0a84a">'+simPct(R.p4)+'</b> <span class="mono dim">/ <input data-sim="tpe.yes" value="'+s.yes+'" style="width:34px;background:#0e131b;border:1px solid #2a3442;color:#e6e9ef;padding:1px 3px;border-radius:4px">¢</span></div>';}
  h+='</div>';
  var sens=[4,6,8].map(function(sd){var f=1-(+s.minor)/100,mu=(R.avg+R.age+(+s.und)+(+s.ext))*f;return 'σ='+sd+'：'+C.a+' '+simPct(simPhi(mu/(sd*f)))+(c==='tpe'?' · 沈≥4 '+simPct(1-simPhi((4+mu)/(sd*f))):'');}).join('<br>');
  h+='<div class="note" style="margin-top:8px;font-size:11.5px">误差敏感度（其他设定不变）：<br>'+sens+'</div></div>';
  return h;}
function simHTML(){return '<section class="panel" id="simPanel"><div class="panel-head"><h2 class="amber">④-A0b 胜率模拟器</h2><span class="sub">把民调平均当中心、民调误差当宽度，算出“真实可能性”，再和盘口对照</span></div><div class="note" style="margin-bottom:10px">怎么读：曲线是“最终差距”可能落在哪里，越高越可能。蓝色面积 = 蓝营赢的概率，绿色 = 绿营赢。模型只是把你的假设变成数字：民调选哪几份、误差设多大、未决定者往哪边倒，结果会差很多。它不是预测，更不是下注建议；开票后可以回头检查哪种假设最接近。</div><div style="display:grid;grid-template-columns:minmax(330px,1fr) minmax(330px,1fr);gap:14px">'+simCard('tpe')+simCard('ntp')+'</div><div style="text-align:right;margin-top:8px"><button class="chip btn" id="simReset">恢复默认假设</button></div></section>';}
var simT=null;
function simRefresh(m){clearTimeout(simT);simT=setTimeout(function(){var p=$('#simPanel',m);if(!p||!p.isConnected)return;var d=document.createElement('div');d.innerHTML=simHTML();p.parentNode.replaceChild(d.firstChild,p);bindSim(m);},20);}
function bindSim(m){
  $$('[data-sim]',m).forEach(function(el){var ev=el.type==='range'?'oninput':'onchange';el[ev]=function(){var k=el.getAttribute('data-sim').split('.'),s=simSt(k[0]);
    if(k[1]==='on')s.on[k[2]]=el.checked?1:0;else if(k[1]==='t'){var v=parseFloat(el.value);if(isFinite(v))s.t[+k[2]]=Math.max(10,Math.min(100,v));}else{var v2=parseFloat(el.value);if(isFinite(v2))s[k[1]]=v2;}
    save();if(el.type==='range'){var sp=el.nextElementSibling;if(sp)sp.textContent=el.value;clearTimeout(simT);simT=setTimeout(function(){simRefresh(m);},250);}else simRefresh(m);};});
  var r=$('#simReset',m);if(r)r.onclick=function(){S.ui.sim={};save();simRefresh(m);toast('已恢复默认假设');};}
/* =========================================================
   10. 路由 / 渲染 / 事件
   ========================================================= */
function setTab(k){if(S.ui.tab!==k){S.ui.tab=k;save();renderMain();}$$('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===k);});}
function renderMain(){
  var m=$('#main'),k=S.ui.tab;
  $$('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===k);});
  if(k==='m1'){
    m.innerHTML=renderM1()+purgeHTML()+heatHTML()+stanceMatrixHTML();bindStance(m);bindHeat(m);var wq=$('#wqsOpen',m);if(wq)wq.onclick=function(e){e.preventDefault();openWqs();};
    $$('.tl-node',m).forEach(function(el){el.onclick=function(){openTL(el.getAttribute('data-tl'));};});
    $$('.pc',m).forEach(function(el){el.onclick=function(){openPerson(el.getAttribute('data-pid'));};});
    $$('[data-tf]',m).forEach(function(el){el.onclick=function(){S.ui.tigerFilter=el.getAttribute('data-tf');save();$$('[data-tf]',m).forEach(function(x){x.classList.toggle('on',x===el);});renderFeed();};});
    $('#diffSel').onchange=function(){S.ui.diffPreset=+this.value;save();renderDiff();};
    $$('input[data-w]',m).forEach(function(inp){inp.oninput=function(){S.weights[inp.getAttribute('data-w')]=+inp.value;save();renderRadar();renderKPI();};});
    $('#wReset').onclick=function(){S.weights=Object.assign({},DEFAULT_W);save();$$('input[data-w]',m).forEach(function(i){i.value=S.weights[i.getAttribute('data-w')];});renderRadar();renderKPI();toast('已恢复默认权重 25/25/15/15/10/10');};
    post(m);renderFeed();renderDiff();renderRadar();
  }else if(k==='m2'){m.innerHTML=renderM2()+dcMapHTML()+cnTeamHTML();bindWires(m);bindM2(m);bindCnTeam(m);bindDcMap(m);post(m);}
  else if(k==='m3'){m.innerHTML=renderM3()+nukeHTML()+aisHTML()+econHTML();var af=$('#aisFear',m);if(af)af.onclick=openFear;bindWires(m);bindM3(m);bindScore(m);bindEcon(m);var nb=$('#nukeOpen',m);if(nb)nb.onclick=openNuke;post(m);}
  else if(k==='m4'){m.innerHTML=nightHTML()+simHTML()+twHTML()+electionHTML()+twmHTML()+twplHTML()+twMidHTML()+twpHTML()+twsHTML()+twhHTML()+twjpPeopleHTML()+kcardsHTML()+renderM4();bindM4(m);bindNight(m);bindSim(m);bindTW(m);bindElection(m);bindTwm(m);bindTwpl(m);bindTwMid(m);bindTwp(m);bindTws(m);bindTwh(m);bindTWJP(m);$$('[data-k]',m).forEach(function(el){el.onclick=function(){openKCard(el.getAttribute('data-k'));};});post(m);}
  else if(k==='m5'){m.innerHTML=renderM5();bindM5(m);bindSummit(m);post(m);}
  else if(k==='m6'){m.innerHTML=renderM6();bindM6(m);post(m);renderM6List();}
  else if(k==='m7'){m.innerHTML=thHTML();bindTh(m);post(m);}
  else if(k==='m8'){m.innerHTML=pbHTML();bindPb(m);post(m);}
  else{m.innerHTML=renderPH(k);post(m);}
}
function renderFoot(){$('#foot').innerHTML='本地键名 <span class="mono">'+KEY+'</span> · schema v'+SCHEMA+' · 基线 '+BASELINE+' · 单文件离线，无任何外部依赖 · 人物因子为主观示意值，仅供研究复盘';post($('#foot'));}
function renderAll(){
  ensureOverlay();rebuildP();recordRadar();
  document.body.classList.toggle('boss',!!S.ui.boss);
  document.title=S.ui.boss?'Global Macro & Semi Tracker':'宏观与半导体情报终端 · Macro Intel Terminal v2';
  $('#brandTitle').firstChild.nodeValue=S.ui.boss?'Global Macro & Semi Tracker':'宏观政治 × 全球半导体 情报终端';
  var tabNames=S.ui.boss?['① Policy Cycle','② Chip Controls','③ AI Scorecard','④ Regional Security','⑤ Diplomacy','⑥ Timeline','⑦ Macro Pulse','⑧ Monetary Tools']:['① 政治周期 & 人事反腐','② 芯片博弈：谁卡谁','③ 中美 AI 国运计分板','④ 台海与军事态势','⑤ 元首外交雷达','⑥ 跨轨时间轴 & 周报','⑦ 中国体温计','⑧ 央行工具箱'];

  renderKPI();renderMain();renderFoot();updateSyncLbl();

function toggleBoss(){S.ui.boss=!S.ui.boss;save();closeDrawer();tip.classList.remove('on');renderAll();}

$('#tabs').onclick=function(e){var b=e.target.closest('button');if(b)setTab(b.getAttribute('data-tab'));};

$('#btnWeekly').onclick=openWeekly;

$('#btnExport').onclick=function(){
  var data={exportedAt:new Date().toISOString(),key:KEY,schema:SCHEMA,state:S};

$('#btnRestore').onclick=function(){$('#restoreFile').value='';$('#restoreFile').click();};

$('#btnReset').onclick=function(){
  if(!confirm('重置基线：恢复默认权重，清除人物因子覆盖值、已导入的增量情报/人物/标的/公报 Diff。\n\n个人笔记、人物批注、概率记分板与快照、证伪绊索勾选、六维打分、导入日志将保留。\n\n建议先导出备份。确定继续？'))return;
  var keep={notes:S.notes,personNotes:S.personNotes,imports:S.imports,snapshots:S.snapshots,radarHist:S.radarHist,lastSync:S.lastSync,overlay:{probs:S.overlay.probs,wires:S.overlay.wires,score:S.overlay.score||{}},ui:{tab:S.ui.tab,boss:S.ui.boss,tigerFilter:'all',diffPreset:0}};
  S=defaults();Object.assign(S,keep);S.ui=Object.assign(defaults().ui,keep.ui,{lines:{cn:1,semi:1,ai:1,tw:1,dip:1}});save();renderAll();toast('已重置基线（笔记已保留）');
};
document.addEventListener('keydown',function(e){
  var tg=e.target.tagName;var typing=/INPUT|TEXTAREA|SELECT/.test(tg)||e.target.isContentEditable;
  if(e.key==='Escape'){closeDrawer();return;}
  if(!typing&&e.shiftKey&&(e.key==='N'||e.key==='n')){e.preventDefault();openQuickNote();return;}
  if(!typing&&e.shiftKey&&(e.key==='B'||e.key==='b')){e.preventDefault();toggleBoss();}
});
window.addEventListener('scroll',function(){tip.classList.remove('on');},{passive:true});

renderAll();
autoPullLatest();
})();
